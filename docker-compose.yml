services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_KIND: sqlite
      SQLITE_FILE: ./runtime/fanta.sqlite
      REDIS_URL: redis://redis:6379
      # was absent: the value in .env is only used for compose-file substitution, never
      # injected into the container, so tuning it had no effect on the API's outbound fetches
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-20000}
    volumes:
      - api_runtime:/app/runtime
    ports: ["3000:3000"]
    depends_on: [redis]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3001
      API_BASE_URL: http://api:3000
    ports: ["3001:3001"]
    depends_on: [api]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: fanta
      MYSQL_USER: fanta
      MYSQL_PASSWORD: fanta
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql

  # Read-only DB browser for the REAL sqlite file (dev/diagnostic tool, not part of the app's
  # runtime). Bind-mounts the host `./runtime` directory directly — the SAME file
  # `npm run dev:api` writes to locally — NOT the `api_runtime` named volume above, which is a
  # separate copy used only when the `api` service itself runs in Docker (see LEARNED.md's
  # note on that exact confusion). Start on demand: `docker compose --profile tools up -d
  # sqlite-web`, then open http://localhost:8080. Never starts with a plain `docker compose up`.
  sqlite-web:
    image: coleifer/sqlite-web
    profiles: ["tools"]
    command: ["sqlite_web", "-H", "0.0.0.0", "-r", "/data/fanta.sqlite"]
    volumes:
      - ./runtime:/data:ro
    ports: ["8080:8080"]

volumes:
  api_runtime:
  mysql_data:
